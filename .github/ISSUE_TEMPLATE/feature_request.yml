name: Feature request
description: Suggest a primitive, preset, integration or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that Glass UI doesn't support today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should it work? Mockups or links to reference designs help.
    validations:
      required: true
