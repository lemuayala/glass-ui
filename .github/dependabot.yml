version: 2
updates:
  # Keeps pinned GitHub Actions current (security fixes, Node runtime deprecations).
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # One grouped weekly PR for minor/patch npm updates across the workspace; majors come one by one.
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
